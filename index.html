<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roof Guys — Client Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&display=swap');
:root{--black:#07080a;--surface:#0f1014;--card:#14161b;--card2:#1a1d24;--border:#22252e;--dim:#555c70;--text:#9da3b4;--white:#eef0f5;--gold:#c8922a;--gold-bg:rgba(200,146,42,0.08);--green:#3db87a;--green-bg:rgba(61,184,122,0.08);--red:#e05c5c;--blue:#4a8ec2;--purple:#9b7fa8;--font-d:'Barlow Condensed',sans-serif;--font-b:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh;font-size:14px;}
input,select,textarea{font-family:var(--font-b);}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.brand{font-family:var(--font-d);font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--white);}
.brand em{color:var(--gold);font-style:normal;}
main{max-width:900px;margin:0 auto;padding:24px 16px;}
.stat-section-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:8px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-card.split{border-color:rgba(74,142,194,0.3);}
.stat-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.stat-val{font-family:var(--font-d);font-size:28px;font-weight:900;line-height:1;}
.total-bar{background:linear-gradient(135deg,rgba(61,184,122,0.1),rgba(61,184,122,0.03));border:1px solid rgba(61,184,122,0.25);border-radius:10px;padding:14px 20px;margin-bottom:16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:12px;padding:6px 14px;cursor:pointer;}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700;}
.search-inp{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--white);font-size:13px;padding:8px 12px;outline:none;}
.add-btn{background:var(--gold);border:none;color:#000;font-family:var(--font-d);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:1px;padding:8px 20px;border-radius:8px;cursor:pointer;}
/* CLIENT CARD */
.client-card{border:2px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;}
.client-card.closed{border-color:var(--green);background:rgba(61,184,122,0.03);}
.client-card.split-deal{border-color:rgba(74,142,194,0.4);}
.card-header{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;background:var(--card);user-select:none;}
.card-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.card-name{font-family:var(--font-d);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:1px;}
.card-meta{font-size:11px;color:var(--dim);margin-top:2px;}
.card-chevron{margin-left:auto;color:var(--dim);font-size:14px;transition:transform 0.2s;}
.card-body{padding:0 16px 16px;background:var(--card);border-top:1px solid var(--border);display:none;}
.card-body.open{display:block;}
/* INPUTS */
.inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--white);font-size:13px;padding:9px 11px;outline:none;transition:border-color 0.15s;}
.inp:focus{border-color:var(--gold);}
.inp.warn{border-color:var(--red);}
.sel{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--white);font-size:13px;padding:9px 11px;outline:none;cursor:pointer;-webkit-appearance:none;}
.lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px;font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.fg{margin-bottom:0;}
.iw{position:relative;}
.iw .ip{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none;}
.iw .inp{padding-left:22px;}
/* TRADE BLOCK */
.trade-block{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.trade-title{font-family:var(--font-d);font-size:15px;font-weight:700;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.calc-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:10px 12px;background:var(--card);border-radius:8px;margin-top:10px;}
.calc-item .cl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
.calc-item .cv{font-family:var(--font-d);font-size:20px;font-weight:800;}
.min-hint{font-size:11px;color:var(--gold);margin-top:6px;}
.min-hint.warn{color:var(--red);}
/* FINANCIALS */
.fin-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.fin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
.fin-item .fl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.fin-item .fv{font-family:var(--font-d);font-size:24px;font-weight:800;}
.remain-bar{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:8px;}
/* SPLIT */
.split-box{background:rgba(74,142,194,0.06);border:1px solid rgba(74,142,194,0.25);border-radius:10px;padding:14px;margin-bottom:12px;}
/* CHECKS */
.check-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:4px;}
.check-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;}
/* SECTION DIVIDER */
.sec-div{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:700;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.del-btn{background:none;border:1px solid var(--red);border-radius:6px;color:var(--red);font-size:12px;padding:5px 12px;cursor:pointer;}
.remove-trade{background:none;border:1px solid var(--border);border-radius:5px;color:var(--dim);font-size:11px;padding:3px 8px;cursor:pointer;}
.remove-trade:hover{border-color:var(--red);color:var(--red);}
.add-trade-btn{width:100%;background:none;border:1px dashed var(--border);border-radius:8px;color:var(--gold);font-family:var(--font-d);font-size:14px;font-weight:700;text-transform:uppercase;padding:10px;cursor:pointer;margin-bottom:14px;}
.add-trade-btn:hover{border-color:var(--gold);}
.empty{text-align:center;padding:48px;color:var(--dim);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.saving{font-size:11px;color:var(--dim);}
</style>
</head>
<body>
<header>
  <div class="brand">Roof <em>Guys</em> <span style="font-size:13px;color:var(--dim);font-family:var(--font-b);font-weight:400;letter-spacing:0;text-transform:none;">Client Tracker</span></div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button onclick="debugData()" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:11px;padding:5px 10px;cursor:pointer;">Debug</button>
    <span class="saving" id="savingLabel"></span>
    <button class="add-btn" onclick="addClient()">+ Add Client</button>
  </div>
</header>

<main>
  <div id="statsArea"></div>
  <div class="filters">
    <input class="search-inp" type="text" placeholder="Search clients..." oninput="renderAll()" id="searchBox">
    <button class="filter-btn active" onclick="setFilter('All')">All</button>
    <button class="filter-btn" onclick="setFilter('Open')">Open</button>
    <button class="filter-btn" onclick="setFilter('Closed')">Closed</button>
    <button class="filter-btn" onclick="setFilter('COC Pending')">COC Pending</button>
  </div>
  <div id="clientList"></div>
</main>

<script>
const PITCH_PRICES={'Low Pitch 1 Story':244.96,'Low Pitch 2 Story':250.29,'High Pitch 1 Story':255.63,'High Pitch 2 Story':260.96,'Metal':330.00};
const GUTTER_RATES={'5"':6,'6"':7};
const SIDING_RATE=300,DECK_RATE=16,MIN_SQ=525;
const TRADE_OPTS=['Roof','Gutters','Siding','Concrete','Deck','Other'];
const PITCH_OPTS=Object.keys(PITCH_PRICES);
const GUTTER_OPTS=Object.keys(GUTTER_RATES);

const SB_URL='https://ovdzbhvpktjctucuppxx.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92ZHpiaHZwa3RqY3R1Y3VwcHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MDY4NTEsImV4cCI6MjA5NzQ4Mjg1MX0.RxgO870UY7Ia8t04ZJ3PyaohMka9mX4MalDEQKqtcEQ';

let clients=[],filter='All',syncTimer=null;

async function sb(path,opts={}){
  const r=await fetch(SB_URL+path,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},...opts});
  if(!r.ok){const e=await r.text();throw new Error(e);}
  if(r.status===204)return null;
  return r.json();
}

function mapRow(r){return{id:r.id,name:r.name||'',trades:Array.isArray(r.trades)&&r.trades.length>0?r.trades:[newTrade()],outOfPocket:r.out_of_pocket||'',insuranceCollected:r.insurance_collected||'',splitCommission:r.split_commission===true,splitWith:r.split_with||'',cocSent:r.coc_sent===true,closed:r.closed===true,notes:r.notes||'',open:false};}
function toRow(c){return{name:c.name||'',trades:c.trades,out_of_pocket:parseFloat(c.outOfPocket)||null,insurance_collected:parseFloat(c.insuranceCollected)||null,split_commission:c.splitCommission===true,split_with:c.splitWith||null,coc_sent:c.cocSent===true,closed:c.closed===true,notes:c.notes||''};}

async function load(){
  try{
    const data=await sb('/rest/v1/rg_clients?select=*&order=created_at.desc');
    clients=(data||[]).map(mapRow);
  }catch(e){
    document.getElementById('savingLabel').textContent='DB Error: '+e.message.slice(0,50);
  }
  renderAll();
}

function syncClient(c){
  clearTimeout(syncTimer);
  document.getElementById('savingLabel').textContent='Saving...';
  syncTimer=setTimeout(async()=>{
    try{
      await sb('/rest/v1/rg_clients?id=eq.'+c.id,{method:'PATCH',body:JSON.stringify(toRow(c))});
      document.getElementById('savingLabel').textContent='Saved';
      setTimeout(()=>document.getElementById('savingLabel').textContent='',1200);
    }catch(e){document.getElementById('savingLabel').textContent='Save error: '+e.message.slice(0,30);}
  },500);
}

function save(){document.getElementById('savingLabel').textContent='Saving...';}

async function addClient(){
  try{
    const data=await sb('/rest/v1/rg_clients',{method:'POST',body:JSON.stringify({name:'',trades:[newTrade()],out_of_pocket:null,insurance_collected:null,split_commission:false,split_with:null,coc_sent:false,closed:false,notes:''})});
    clients.unshift(mapRow(data[0]));
    renderAll();
  }catch(e){alert('Could not add client: '+e.message);}
}

async function deleteClient(id){
  if(!confirm('Delete this client?'))return;
  try{await sb('/rest/v1/rg_clients?id=eq.'+id,{method:'DELETE',headers:{'Prefer':''}});}catch(e){}
  clients=clients.filter(c=>c.id!==id);
  renderAll();
}


function fmt(n){return'$'+Math.abs(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtS(n){return(n<0?'-$':'$')+Math.abs(n||0).toLocaleString('en-US',{maximumFractionDigits:0});}

function buildCost(t){
  const q=parseFloat(t.qty)||0;
  if(t.type==='Roof')return q*(PITCH_PRICES[t.pitch]||244.96);
  if(t.type==='Gutters')return q*(GUTTER_RATES[t.gutterSize]||6);
  if(t.type==='Siding')return q*SIDING_RATE;
  if(t.type==='Deck')return q*DECK_RATE;
  return parseFloat(t.customCost)||0;
}
function commission(t){
  const c=parseFloat(t.contractPrice)||0;
  const b=buildCost(t);
  const op=(parseFloat(t.opPct)||5)/100;
  return(c-b-c*op)*0.5;
}
function totalCommission(client){return client.trades.reduce((s,t)=>s+commission(t),0);}
function totalContract(client){return client.trades.reduce((s,t)=>s+(parseFloat(t.contractPrice)||0),0);}

function newTrade(){return{id:Date.now()+Math.random(),type:'Roof',pitch:'Low Pitch 1 Story',gutterSize:'5"',qty:'',contractPrice:'',opPct:'5',customCost:''};}
function newClient(){return{id:Date.now().toString(),name:'',trades:[newTrade()],outOfPocket:'',insuranceCollected:'',splitCommission:false,splitWith:'',cocSent:false,closed:false,notes:'',open:true};}

async function addClient(){
  try{
    const data=await sb('/rest/v1/rg_clients',{method:'POST',body:JSON.stringify({name:'',trades:[newTrade()],out_of_pocket:null,insurance_collected:null,split_commission:false,split_with:null,coc_sent:false,closed:false,notes:''})});
    clients.unshift(mapRow(data[0]));
    renderAll();
  }catch(e){alert('Could not add client: '+e.message);}
}
function deleteClient(id){
  if(!confirm('Delete this client?'))return;
  clients=clients.filter(c=>c.id!==id);
  save();renderAll();
}
function getClient(id){return clients.find(c=>c.id===id);}
function updateClient(id,fn){const c=getClient(id);if(c){fn(c);save();renderStats();}}

function setFilter(f){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent===f));
  renderList();
}

// ── STATS ─────────────────────────────────────────────────────────
function renderStats(){
  const isSplit=c=>c.splitCommission===true||c.splitCommission==='true'||c.splitCommission===1;
  const full=clients.filter(c=>!isSplit(c));
  const splits=clients.filter(c=>isSplit(c));
  console.log('Split clients:',splits.map(c=>c.name),'Full clients:',full.map(c=>c.name));
  const fContract=full.reduce((s,c)=>s+totalContract(c),0);
  const fComm=full.reduce((s,c)=>s+totalCommission(c),0);
  const sContract=splits.reduce((s,c)=>s+totalContract(c),0);
  const sComm=splits.reduce((s,c)=>s+totalCommission(c),0);
  const sYours=sComm*0.5;
  let html='';
  const allYours=fComm+sYours;
  const allContract=fContract+sContract;
  const overallPct=allContract>0?((allYours/allContract)*100).toFixed(1)+'%':'—';
  html+='<div class="stat-section-label">Overall</div>';
  html+='<div class="stats-grid" style="margin-bottom:16px;">';
  html+=statCard('Total Contract',fmtS(allContract),'var(--white)');
  html+=statCard('Total You Take Home',fmtS(allYours),'var(--green)');
  html+='<div class="stat-card"><div class="stat-label">Commission % of Revenue</div><div class="stat-val" style="color:'+(parseFloat(overallPct)>=20?'var(--green)':parseFloat(overallPct)>=12?'var(--gold)':'var(--red)')+'">'+overallPct+'</div></div>';
  html+=statCard('Total Clients',clients.length,'var(--white)');
  html+='</div>';
  html+='<div class="stat-section-label">Full Deals</div>';
  html+='<div class="stats-grid">';
  html+=statCard('Total Contract',fmtS(fContract),'var(--white)');
  html+=statCard('Total Commission',fmtS(fComm),'var(--green)');
  html+=statCard('Active',full.filter(c=>!c.closed).length,'var(--gold)');
  html+=statCard('Closed',full.filter(c=>c.closed).length,'var(--green)');
  html+='</div>';
  if(splits.length>0){
    html+='<div class="stat-section-label" style="color:var(--blue)">Split Deals</div>';
    html+='<div class="stats-grid">';
    html+=statCard('Split Contract',fmtS(sContract),'var(--white)',true);
    html+=statCard('Full Commission',fmtS(sComm),'var(--dim)',true);
    html+=statCard('Your Split Payout',fmtS(sYours),'var(--green)',true);
    html+=statCard('Split Clients',splits.length,'var(--blue)',true);
    html+='</div>';
    html+='<div class="total-bar"><div><div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:3px;">Total You Take Home</div><div style="font-family:var(--font-d);font-size:32px;font-weight:900;color:var(--green);">'+fmtS(fComm+sYours)+'</div></div><div style="font-size:12px;color:var(--dim);">'+fmtS(fComm)+' full deals + '+fmtS(sYours)+' split deals</div></div>';
  }
  document.getElementById('statsArea').innerHTML=html;
}
function statCard(label,val,color,isSplit){
  return'<div class="stat-card'+(isSplit?' split':'')+'"><div class="stat-label">'+label+'</div><div class="stat-val" style="color:'+color+'">'+val+'</div></div>';
}

// ── TRADE HTML ─────────────────────────────────────────────────────
function tradeHTML(cid,t,idx,canRemove){
  const q=parseFloat(t.qty)||0;
  const c=parseFloat(t.contractPrice)||0;
  const b=buildCost(t);
  const com=commission(t);
  const op=parseFloat(t.opPct)||5;
  const payPct=c>0?(com/c*100):0;
  const minPrice=t.type==='Roof'?q*MIN_SQ:null;
  const belowMin=minPrice&&c>0&&c<minPrice;
  let html='<div class="trade-block" id="tb_'+cid+'_'+idx+'">';
  html+='<div class="trade-title"><span>'+t.type+'</span>'+(canRemove?'<button class="remove-trade" onclick="removeTrade(\''+cid+'\','+idx+')">Remove</button>':'')+'</div>';
  html+='<div class="grid3" style="margin-bottom:10px;">';
  html+='<div class="fg"><label class="lbl">Trade Type</label><select class="sel" onchange="updateTrade(\''+cid+'\','+idx+',\'type\',this.value)">'+TRADE_OPTS.map(o=>'<option'+(o===t.type?' selected':'')+'>'+o+'</option>').join('')+'</select></div>';
  if(t.type==='Roof'){
    html+='<div class="fg"><label class="lbl">Pitch / Stories</label><select class="sel" onchange="updateTrade(\''+cid+'\','+idx+',\'pitch\',this.value)">'+PITCH_OPTS.map(o=>'<option'+(o===t.pitch?' selected':'')+'>'+o+'</option>').join('')+'</select></div>';
  } else if(t.type==='Gutters'){
    html+='<div class="fg"><label class="lbl">Gutter Size</label><select class="sel" onchange="updateTrade(\''+cid+'\','+idx+',\'gutterSize\',this.value)"><option'+(t.gutterSize==='5"'?' selected':'')+'>5"</option><option'+(t.gutterSize==='6"'?' selected':'')+'>6"</option></select></div>';
  } else { html+='<div></div>'; }
  html+='<div class="fg"><label class="lbl">O&P %</label><select class="sel" onchange="updateTrade(\''+cid+'\','+idx+',\'opPct\',this.value)"><option value="5"'+(t.opPct==='5'?' selected':'')+'>5% Self-Gen</option><option value="15"'+(t.opPct==='15'?' selected':'')+'>15% RG Lead</option></select></div>';
  html+='</div>';
  html+='<div class="grid2">';
  const qLabel=t.type==='Gutters'?'Linear Feet':t.type==='Deck'?'Boards':'Squares';
  html+='<div class="fg"><label class="lbl">'+qLabel+'</label><input class="inp" type="number" value="'+(t.qty||'')+'" placeholder="0" onchange="updateTrade(\''+cid+'\','+idx+',\'qty\',this.value)"></div>';
  if(t.type==='Other'||t.type==='Concrete'){
    html+='<div class="fg"><label class="lbl">Your Build Cost ($)</label><div class="iw"><span class="ip">$</span><input class="inp" type="number" value="'+(t.customCost||'')+'" placeholder="0.00" onchange="updateTrade(\''+cid+'\','+idx+',\'customCost\',this.value)"></div></div>';
  } else { html+='<div></div>'; }
  html+='</div>';
  html+='<div style="margin-top:10px;"><label class="lbl">Contract Price ($)</label><div class="iw"><span class="ip">$</span><input class="inp'+(belowMin?' warn':'')+'" type="number" value="'+(t.contractPrice||'')+'" placeholder="0.00" onchange="updateTrade(\''+cid+'\','+idx+',\'contractPrice\',this.value)"></div>';
  if(t.type==='Roof'&&q>0){
    html+='<div class="min-hint'+(belowMin?' warn':'')+'">Bare minimum ('+q+' sq × $'+MIN_SQ+'): '+fmt(minPrice)+(belowMin?' ⚠️ Below minimum!':'')+'</div>';
    html+='<div style="font-size:11px;color:var(--dim);margin-top:2px;">Build cost at pitch: '+fmt(b)+'</div>';
  }
  html+='</div>';
  if(q>0&&c>0){
    html+='<div class="calc-row">';
    html+='<div class="calc-item"><div class="cl">Build Cost</div><div class="cv" style="color:var(--red)">'+fmt(b)+'</div></div>';
    html+='<div class="calc-item"><div class="cl">Your Commission</div><div class="cv" style="color:'+(com>=0?'var(--green)':'var(--red)')+'">'+fmt(com)+'</div></div>';
    html+='<div class="calc-item"><div class="cl">Payout %</div><div class="cv" style="color:'+(payPct>=20?'var(--green)':payPct>=12?'var(--gold)':'var(--red)')+'">'+payPct.toFixed(1)+'%</div></div>';
    html+='</div>';
  }
  html+='</div>';
  return html;
}

// ── CLIENT HTML ───────────────────────────────────────────────────
function clientHTML(c){
  const tCont=totalContract(c);
  const tComm=totalCommission(c);
  const yourComm=c.splitCommission?tComm*0.5:tComm;
  const oop=parseFloat(c.outOfPocket)||0;
  const ins=parseFloat(c.insuranceCollected)||0;
  const remaining=tCont-oop-ins;
  const dotColor=c.closed?'var(--green)':c.cocSent?'var(--gold)':'var(--dim)';
  const tradeNames=c.trades.map(t=>t.type).join(' · ');
  let metaParts=[tradeNames];
  if(tCont>0)metaParts.push(fmt(tCont)+' contract');
  if(yourComm>0)metaParts.push(fmt(yourComm)+(c.splitCommission?' your split':' commission'));
  if(c.closed)metaParts.push('✓ CLOSED');
  if(c.cocSent&&!c.closed)metaParts.push('COC Sent');

  let html='<div class="client-card'+(c.closed?' closed':c.splitCommission?' split-deal':'')+'" id="cc_'+c.id+'">';
  html+='<div class="card-header" onclick="toggleCard(\''+c.id+'\')">';
  html+='<div class="card-dot" style="background:'+dotColor+'"></div>';
  html+='<div><div class="card-name" style="color:'+(c.closed?'var(--green)':'var(--white)')+'">'+( c.name||'New Client')+'</div>';
  html+='<div class="card-meta">'+metaParts.join(' &nbsp;·&nbsp; ')+'</div></div>';
  html+='<div class="card-chevron" id="chev_'+c.id+'" style="transform:'+(c.open?'rotate(180deg)':'none')+'">▼</div>';
  html+='</div>';

  if(c.open){
    html+='<div class="card-body open">';
    // Name
    html+='<div style="margin-top:14px;margin-bottom:14px;"><label class="lbl">Client Name</label><input class="inp" id="name_'+c.id+'" type="text" value="'+escHtml(c.name)+'" placeholder="Client Name" onblur="updateField(\''+c.id+'\',\'name\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()" style="max-width:360px;font-size:15px;font-weight:600;"></div>';
    // Trades
    html+='<div class="sec-div">Trades</div>';
    c.trades.forEach((t,idx)=>{html+=tradeHTML(c.id,t,idx,c.trades.length>1);});
    html+='<button class="add-trade-btn" onclick="addTrade(\''+c.id+'\')">+ Add Another Trade</button>';

    // Financials
    if(tCont>0){
      html+='<div class="sec-div">Financial Summary</div>';
      html+='<div class="fin-box">';
      html+='<div class="fin-grid">';
      html+='<div class="fin-item"><div class="fl">Total Contract</div><div class="fv" style="color:var(--white)">'+fmt(tCont)+'</div></div>';
      if(c.splitCommission){
        html+='<div class="fin-item"><div class="fl">Full Commission</div><div class="fv" style="color:var(--dim)">'+fmt(tComm)+'</div></div>';
        html+='<div class="fin-item"><div class="fl">Your Split (50%)</div><div class="fv" style="color:var(--green)">'+fmt(tComm*0.5)+'</div></div>';
      } else {
        html+='<div class="fin-item"><div class="fl">Your Commission</div><div class="fv" style="color:var(--green)">'+fmt(tComm)+'</div></div>';
      }
      html+='<div class="fin-item"><div class="fl">Remaining to Collect</div><div class="fv" style="color:'+(remaining>0?'var(--gold)':'var(--green)')+'">'+fmt(remaining)+'</div></div>';
      html+='</div>';
      html+='<div class="grid2">';
      html+='<div class="fg"><label class="lbl">Homeowner Out of Pocket ($)</label><div class="iw"><span class="ip">$</span><input class="inp" type="number" value="'+(c.outOfPocket||'')+'" placeholder="0.00" oninput="updateField(\''+c.id+'\',\'outOfPocket\',this.value)"></div></div>';
      html+='<div class="fg"><label class="lbl">Total Insurance Collected ($)</label><div class="iw"><span class="ip">$</span><input class="inp" type="number" value="'+(c.insuranceCollected||'')+'" placeholder="0.00" oninput="updateField(\''+c.id+'\',\'insuranceCollected\',this.value)"></div></div>';
      html+='</div>';
      if(oop>0||ins>0){
        html+='<div class="remain-bar" style="background:'+(remaining>0?'rgba(200,146,42,0.08)':'var(--green-bg)')+';border:1px solid '+(remaining>0?'rgba(200,146,42,0.3)':'rgba(61,184,122,0.3)')+';">';
        html+='<span style="color:var(--dim)">Remaining: </span><strong style="font-family:var(--font-d);font-size:18px;color:'+(remaining>0?'var(--gold)':'var(--green)')+'">'+fmt(remaining)+'</strong>';
        html+='<span style="color:var(--dim);font-size:11px;margin-left:8px;">('+fmt(tCont)+' − '+fmt(oop)+' OOP − '+fmt(ins)+' ins)</span></div>';
      }
      html+='</div>';
    }

    // Split Commission
    html+='<div class="sec-div">Commission Split</div>';
    html+='<div class="split-box">';
    html+='<label class="check-label" style="margin-bottom:'+(c.splitCommission?'10px':'0')+'">';
    html+='<input type="checkbox" '+(c.splitCommission?'checked':'')+' onchange="updateField(\''+c.id+'\',\'splitCommission\',this.checked)" style="width:16px;height:16px;accent-color:var(--blue);cursor:pointer;">';
    html+='<div><div style="font-size:13px;color:'+(c.splitCommission?'var(--blue)':'var(--text)')+';font-weight:'+(c.splitCommission?700:400)+'">Split Commission with Another Rep</div>';
    html+='<div style="font-size:11px;color:var(--dim)">Your cut becomes 50% of total commission</div></div>';
    if(c.splitCommission&&tComm>0){html+='<div style="margin-left:auto;text-align:right;"><div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;">Your Share</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--green);">'+fmt(tComm*0.5)+'</div></div>';}
    html+='</label>';
    if(c.splitCommission){
      html+='<input class="inp" type="text" value="'+escHtml(c.splitWith||'')+'" placeholder="Other rep\'s name" onblur="updateField(\''+c.id+'\',\'splitWith\',this.value)" style="max-width:280px;">';
    }
    html+='</div>';

    // Notes
    html+='<div class="sec-div">Notes</div>';
    html+='<textarea class="inp" rows="3" placeholder="Follow-up notes, next steps..." onblur="updateField(\''+c.id+'\',\'notes\',this.value)" style="resize:vertical;width:100%;line-height:1.6;margin-bottom:14px;">'+escHtml(c.notes||'')+'</textarea>';

    // Checkboxes + delete
    html+='<div class="check-row">';
    html+='<label class="check-label" style="color:'+(c.cocSent?'var(--gold)':'var(--text)')+'"><input type="checkbox" '+(c.cocSent?'checked':'')+' onchange="updateField(\''+c.id+'\',\'cocSent\',this.checked)" style="width:16px;height:16px;accent-color:var(--gold);cursor:pointer;"> COC Sent to Carrier</label>';
    html+='<label class="check-label" style="color:'+(c.closed?'var(--green)':'var(--text)')+';font-weight:'+(c.closed?700:400)+'"><input type="checkbox" '+(c.closed?'checked':'')+' onchange="updateField(\''+c.id+'\',\'closed\',this.checked)" style="width:16px;height:16px;accent-color:var(--green);cursor:pointer;">'+(c.closed?'✓ Closed':'Mark as Closed')+'</label>';
    html+='<button class="del-btn" style="margin-left:auto;" onclick="deleteClient(\''+c.id+'\')">Delete</button>';
    html+='</div>';
    html+='</div>';
  } else {
    html+='<div class="card-body"></div>';
  }
  html+='</div>';
  return html;
}

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── ACTIONS ───────────────────────────────────────────────────────
function toggleCard(id){
  const c=getClient(id);if(!c)return;
  c.open=!c.open;
  renderList();
}
function updateField(id,field,val){
  const c=getClient(id);if(!c)return;
  if(field==='splitCommission'||field==='cocSent'||field==='closed')val=val===true||val==='true';
  c[field]=val;
  syncClient(c);
  renderStats();
  // Only re-render card for boolean fields that change card appearance
  if(['splitCommission','cocSent','closed'].includes(field)){
    const el=document.getElementById('cc_'+id);
    if(el){const tmp=document.createElement('div');tmp.innerHTML=clientHTML(c);el.outerHTML=tmp.firstChild.outerHTML;}
  }
}
function updateTrade(cid,idx,field,val){
  const c=getClient(cid);if(!c)return;
  c.trades[idx][field]=val;
  syncClient(c);renderStats();
  // Re-render trade block only when type changes (UI structure changes)
  if(['type','pitch','gutterSize','opPct'].includes(field)){
    const tb=document.getElementById('tb_'+cid+'_'+idx);
    if(tb){const tmp=document.createElement('div');tmp.innerHTML=tradeHTML(cid,c.trades[idx],idx,c.trades.length>1);tb.outerHTML=tmp.firstChild.outerHTML;}
  } else {
    // Just update the calc row without touching inputs
    const tb=document.getElementById('tb_'+cid+'_'+idx);
    if(!tb)return;
    const t=c.trades[idx];
    const q=parseFloat(t.qty)||0,cont=parseFloat(t.contractPrice)||0;
    const b=buildCost(t),com=commission(t),payPct=cont>0?(com/cont*100):0;
    let calcEl=tb.querySelector('.calc-row');
    if(q>0&&cont>0){
      const h='<div class="calc-item"><div class="cl">Build Cost</div><div class="cv" style="color:var(--red)">'+fmt(b)+'</div></div>'
        +'<div class="calc-item"><div class="cl">Your Commission</div><div class="cv" style="color:'+(com>=0?'var(--green)':'var(--red)')+'">'+fmt(com)+'</div></div>'
        +'<div class="calc-item"><div class="cl">Payout %</div><div class="cv" style="color:'+(payPct>=20?'var(--green)':payPct>=12?'var(--gold)':'var(--red)')+'">'+payPct.toFixed(1)+'%</div></div>';
      if(calcEl){calcEl.innerHTML=h;}else{const d=document.createElement('div');d.className='calc-row';d.innerHTML=h;tb.appendChild(d);}
    } else if(calcEl){calcEl.innerHTML='';}
  }
}
function addTrade(cid){
  const c=getClient(cid);if(!c)return;
  c.trades.push(newTrade());
  syncClient(c);
  const el=document.getElementById('cc_'+cid);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=clientHTML(c);el.outerHTML=tmp.firstChild.outerHTML;}
}
function removeTrade(cid,idx){
  const c=getClient(cid);if(!c||c.trades.length<=1)return;
  c.trades.splice(idx,1);
  syncClient(c);
  const el=document.getElementById('cc_'+cid);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=clientHTML(c);el.outerHTML=tmp.firstChild.outerHTML;}
}

// ── RENDER ────────────────────────────────────────────────────────
function renderList(){
  const search=document.getElementById('searchBox').value.toLowerCase();
  const filtered=clients.filter(c=>{
    if(search&&!(c.name||'').toLowerCase().includes(search))return false;
    if(filter==='Open')return!c.closed;
    if(filter==='Closed')return c.closed;
    if(filter==='COC Pending')return c.cocSent&&!c.closed;
    return true;
  });
  if(filtered.length===0){
    document.getElementById('clientList').innerHTML='<div class="empty"><div class="empty-icon">👤</div><div style="color:var(--white);margin-bottom:12px;">'+(clients.length===0?'No clients yet':'No clients match filter')+'</div>'+(clients.length===0?'<button class="add-btn" onclick="addClient()">Add First Client</button>':'')+'</div>';
  } else {
    document.getElementById('clientList').innerHTML=filtered.map(clientHTML).join('');
  }
}
function renderAll(){renderStats();renderList();}

load();
</script>
</body>
</html>
