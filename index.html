<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roof Empire Client Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap');
:root{--black:#07080a;--surface:#0f1014;--card:#14161b;--card2:#1a1d24;--border:#22252e;--dim:#555c70;--text:#9da3b4;--white:#eef0f5;--gold:#c8922a;--gold-bg:rgba(200,146,42,0.08);--green:#3db87a;--green-bg:rgba(61,184,122,0.08);--red:#e05c5c;--blue:#4a8ec2;--purple:#9b7fa8;--font-d:"Barlow Condensed",sans-serif;--font-b:"Inter",sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh;}
input,select,textarea{font-family:var(--font-b);}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.brand{font-family:var(--font-d);font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--white);}
.brand em{color:var(--gold);font-style:normal;}
main{max-width:960px;margin:0 auto;padding:24px 16px;}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.sl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.sv{font-family:var(--font-d);font-size:26px;font-weight:900;line-height:1;}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--white);font-size:13px;padding:8px 12px;outline:none;}
.fbtn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:12px;padding:6px 14px;cursor:pointer;}
.fbtn.on{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700;}
.addbtn{background:var(--gold);border:none;color:#000;font-family:var(--font-d);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:1px;padding:8px 20px;border-radius:8px;cursor:pointer;}
.cc{border:2px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--card);}
.cc.closed{border-color:var(--green);}
.cc.denied{border-color:var(--red);}
.ch{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none;}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cname{font-family:var(--font-d);font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--white);}
.cmeta{font-size:11px;color:var(--dim);margin-top:2px;}
.cright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.chev{color:var(--dim);font-size:13px;transition:transform 0.2s;}
.cbody{padding:16px;border-top:1px solid var(--border);display:none;}
.cbody.open{display:block;}
.pbadge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;overflow-y:auto;padding:20px;}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:660px;margin:auto;padding:28px;}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/-1;}
.lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-weight:600;}
.inp{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--white);font-size:13px;padding:9px 11px;outline:none;width:100%;}
.inp:focus{border-color:var(--gold);}
.sel{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--white);font-size:13px;padding:9px 11px;outline:none;width:100%;cursor:pointer;-webkit-appearance:none;}
.trow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.tc{background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:600;color:var(--dim);user-select:none;}
.tc.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold);}
.rdet{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;}
.pbox{background:var(--green-bg);border:1px solid rgba(61,184,122,0.25);border-radius:8px;padding:12px 16px;display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;}
.prow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pbtn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:11px;font-weight:600;padding:5px 12px;cursor:pointer;}
.pbtn.on{border-color:var(--gold);color:var(--gold);background:var(--gold-bg);}
.arow{display:flex;gap:10px;align-items:center;}
.svbtn{background:var(--gold);border:none;color:#000;font-family:var(--font-d);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:1px;padding:10px 24px;border-radius:8px;cursor:pointer;}
.svbtn:disabled{opacity:0.5;cursor:not-allowed;}
.delbtn{background:none;border:1px solid var(--red);border-radius:7px;color:var(--red);font-size:12px;padding:9px 16px;cursor:pointer;}
.canbtn{background:none;border:1px solid var(--border);border-radius:7px;color:var(--dim);font-size:12px;padding:9px 16px;cursor:pointer;}
.empty{text-align:center;padding:60px 20px;color:var(--dim);}
</style>
</head>
<body>
<header>
  <div class="brand">Roof <em>Empire</em></div>
  <div style="display:flex;gap:10px;align-items:center;">
    <span id="hs" style="font-size:11px;color:var(--dim)"></span>
    <button class="addbtn" onclick="openNew()">+ Add Client</button>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input class="search" id="srch" type="text" placeholder="Search name, address, carrier..." oninput="renderList()">
    <button class="fbtn on" onclick="setF('All',this)">All</button>
    <button class="fbtn" onclick="setF('Active',this)">Active</button>
    <button class="fbtn" onclick="setF('Approved',this)">Approved</button>
    <button class="fbtn" onclick="setF('Closed',this)">Closed</button>
    <button class="fbtn" onclick="setF('Denied',this)">Denied</button>
  </div>
  <div id="list"></div>
</main>
<div class="overlay" id="modal"><div class="mbox" id="mbox"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxDR3-zhqsySClxoRPMv_oYyl26ruP_ClDpUPf9HPGbbZwwe6Kvg0xn23aISlMBImD_/exec';
const ARCH=575,METAL=850,ABUILD=244.96,MBUILD=415;
const TRADES=['Roof','Gutters','Siding','Concrete','Interior Work'];
const PHASES=['Lead','Filed','In Progress','Approved','Denied','Supplementing','Appraisal','Closed'];
const CARRIERS=['State Farm','Allstate','Farmers','Liberty Mutual','Nationwide','USAA','Travelers','Tennessee Farmers','Farm Bureau','Kentucky Farm Bureau','Encompass','Erie','Auto-Owners','Other'];
const PC={Lead:'#555c70',Filed:'#4a8ec2','In Progress':'#c8922a',Approved:'#3db87a',Denied:'#e05c5c',Supplementing:'#9b7fa8',Appraisal:'#4a8ec2',Closed:'#3db87a'};

let clients=[],curF='All',eid=null,sT=[],sP='Lead';

function fmt(n){return'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fS(n){return'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function hs(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hStat(msg,c){const e=document.getElementById('hs');e.textContent=msg;e.style.color=c||'var(--dim)';setTimeout(()=>e.textContent='',3000);}

function calcP(sq,sh,lead,total){
  sq=parseFloat(sq)||0;if(!sq)return 0;
  const build=sq*(sh==='Metal'?MBUILD:ABUILD);
  const contract=parseFloat(total)||sq*(sh==='Metal'?METAL:ARCH);
  const op=lead==='Self-Gen'?0.05:0.15;
  return(contract-build-contract*op)*0.5;
}

async function apiCall(action,data){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action,...data})});
  return r.json();
}

async function load(){
  document.getElementById('list').innerHTML='<div class="empty">Loading...</div>';
  try{
    const r=await apiCall('getAll',{});
    clients=r.clients||[];
    renderAll();
  }catch(e){document.getElementById('list').innerHTML='<div class="empty">Failed to connect to Google Sheets.</div>';}
}

function renderStats(){
  const tC=clients.reduce((s,c)=>s+(parseFloat(c['Actual Total'])||0),0);
  const tP=clients.reduce((s,c)=>s+calcP(c['Squares'],c['Shingle Type'],c['Lead Source'],c['Actual Total']),0);
  const pct=tC>0?((tP/tC)*100).toFixed(1)+'%':'—';
  const col=parseFloat(pct)>=20?'var(--green)':parseFloat(pct)>=12?'var(--gold)':'var(--red)';
  document.getElementById('stats').innerHTML=
    st('Clients',clients.length,'var(--white)')+
    st('Approved',clients.filter(c=>['Approved','Closed'].includes(c['Phase'])).length,'var(--green)')+
    st('Total Contract',fS(tC),'var(--white)')+
    st('Est. Payout',fS(tP),'var(--green)')+
    st('Payout %',pct,col);
}
function st(l,v,c){return'<div class="stat"><div class="sl">'+l+'</div><div class="sv" style="color:'+c+'">'+v+'</div></div>';}

function renderList(){
  const q=document.getElementById('srch').value.toLowerCase();
  const filtered=clients.filter(c=>{
    const ph=c['Phase']||'Lead';
    if(curF==='Active'&&['Closed','Denied'].includes(ph))return false;
    if(curF==='Approved'&&ph!=='Approved')return false;
    if(curF==='Closed'&&ph!=='Closed')return false;
    if(curF==='Denied'&&ph!=='Denied')return false;
    if(q&&![c['Name'],c['Address'],c['Carrier']].join(' ').toLowerCase().includes(q))return false;
    return true;
  });
  if(!filtered.length){
    document.getElementById('list').innerHTML='<div class="empty"><div style="font-size:40px;opacity:0.3;margin-bottom:12px">👤</div><div style="color:var(--white)">'+( clients.length===0?'No clients yet':'No results')+'</div></div>';
    return;
  }
  document.getElementById('list').innerHTML=filtered.map(c=>{
    const id=c['ID'],ph=c['Phase']||'Lead',phC=PC[ph]||'#555';
    const payout=calcP(c['Squares'],c['Shingle Type'],c['Lead Source'],c['Actual Total']);
    const contract=parseFloat(c['Actual Total'])||0;
    const dot=ph==='Closed'?'var(--green)':ph==='Denied'?'var(--red)':ph==='Approved'?'var(--green)':'var(--gold)';
    return '<div class="cc'+( ph==='Closed'?' closed':ph==='Denied'?' denied':'')+'" id="cc_'+id+'">'+
      '<div class="ch" onclick="toggleC(\''+id+'\')"><div class="cdot" style="background:'+dot+'"></div>'+
      '<div style="flex:1;min-width:0"><div class="cname">'+hs(c['Name']||'No Name')+'</div>'+
      '<div class="cmeta">'+hs(c['Trades']||'')+( c['Carrier']?' · '+hs(c['Carrier']):'')+(contract>0?' · '+fmt(contract):'')+'</div></div>'+
      '<div class="cright"><span class="pbadge" style="background:'+phC+'22;color:'+phC+'">'+ph+'</span>'+
      (payout>0?'<span style="font-family:var(--font-d);font-size:16px;font-weight:800;color:var(--green)">'+fmt(payout)+'</span>':'')+
      '<span class="chev" id="chev_'+id+'">▼</span></div></div>'+
      '<div class="cbody" id="cb_'+id+'">'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:12px;">'+
      (c['Phone']?'<div><div class="lbl">Phone</div><div style="color:var(--white);font-size:13px;">'+hs(c['Phone'])+'</div></div>':'')+
      (c['Address']?'<div><div class="lbl">Address</div><div style="color:var(--text);font-size:12px;">'+hs(c['Address'])+'</div></div>':'')+
      (c['Carrier']?'<div><div class="lbl">Carrier</div><div style="color:var(--text);font-size:13px;">'+hs(c['Carrier'])+'</div></div>':'')+
      (c['Lead Source']?'<div><div class="lbl">Lead Source</div><div style="color:var(--gold);font-size:13px;font-weight:600;">'+hs(c['Lead Source'])+'</div></div>':'')+
      (c['Shingle Type']?'<div><div class="lbl">Shingle</div><div style="color:var(--text);font-size:13px;">'+hs(c['Shingle Type'])+'</div></div>':'')+
      (c['Squares']?'<div><div class="lbl">Squares</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--white)">'+c['Squares']+' sq</div></div>':'')+
      (contract>0?'<div><div class="lbl">Actual Total</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--white)">'+fmt(contract)+'</div></div>':'')+
      (payout>0?'<div><div class="lbl">Est. Payout</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--green)">'+fmt(payout)+'</div></div>':'')+
      (c['Insurance Status']?'<div><div class="lbl">Ins. Status</div><div style="font-size:13px;font-weight:600;color:'+( c['Insurance Status']==="Approved"?"var(--green)":c['Insurance Status']==="Denied"?"var(--red)":"var(--text)")+'">'+hs(c['Insurance Status'])+'</div></div>':'')+
      '</div>'+
      (c['Notes']?'<div style="background:var(--surface);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--dim);margin-bottom:12px;">'+hs(c['Notes'])+'</div>':'')+
      '<button onclick="openEdit(\''+id+'\')" style="background:var(--gold);border:none;color:#000;font-family:var(--font-d);font-size:14px;font-weight:800;text-transform:uppercase;padding:8px 20px;border-radius:7px;cursor:pointer;">Edit</button>'+
      '</div></div>';
  }).join('');
}

function renderAll(){renderStats();renderList();}
function toggleC(id){const b=document.getElementById('cb_'+id),cv=document.getElementById('chev_'+id);const o=b.classList.toggle('open');cv.style.transform=o?'rotate(180deg)':'none';}
function setF(f,btn){curF=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderList();}
function openNew(){eid=null;sT=[];sP='Lead';buildModal({});}
function openEdit(id){const c=clients.find(x=>x['ID']===id);if(!c)return;eid=id;sT=(c['Trades']||'').split(',').map(t=>t.trim()).filter(Boolean);sP=c['Phase']||'Lead';buildModal(c);}
function closeModal(){document.getElementById('modal').style.display='none';eid=null;}

function buildModal(c){
  const isE=!!eid;
  document.getElementById('modal').style.display='block';
  const sh=c['Shingle Type']||'Architectural';
  const sq=c['Squares']||'';
  const lead=c['Lead Source']||'Company Lead';
  document.getElementById('mbox').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'+
    '<div style="font-family:var(--font-d);font-size:22px;font-weight:900;text-transform:uppercase;color:var(--white)">'+( isE?'Edit Client':'New Client')+'</div>'+
    '<button onclick="closeModal()" style="background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;">✕</button></div>'+
    '<div class="fg2">'+
    '<div class="fg"><label class="lbl">Name *</label><input class="inp" id="mN" value="'+hs(c['Name']||'')+'" placeholder="Jane Smith"></div>'+
    '<div class="fg"><label class="lbl">Phone</label><input class="inp" id="mPh" value="'+hs(c['Phone']||'')+'" placeholder="(931) 555-0100"></div>'+
    '<div class="fg full"><label class="lbl">Address</label><input class="inp" id="mA" value="'+hs(c['Address']||'')+'" placeholder="123 Main St, Clarksville TN"></div>'+
    '<div class="fg"><label class="lbl">Carrier</label><select class="sel" id="mCar"><option value="">Select...</option>'+CARRIERS.map(ca=>'<option'+( c['Carrier']===ca?' selected':'')+'>'+ca+'</option>').join('')+'</select></div>'+
    '<div class="fg"><label class="lbl">Insurance Status</label><select class="sel" id="mIS">'+['Pending','Approved','Denied','Not Filed'].map(s=>'<option'+( c['Insurance Status']===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>'+
    '</div>'+
    '<div class="lbl" style="margin-bottom:8px">Trades</div>'+
    '<div class="trow">'+TRADES.map(t=>'<div class="tc'+( sT.includes(t)?' on':'')+'" onclick="togT(\''+t+'\',this)">'+t+'</div>').join('')+'</div>'+
    '<div id="rdet">'+( sT.includes('Roof')?roofHTML(sh,sq):'')+'</div>'+
    '<div class="fg2">'+
    '<div class="fg"><label class="lbl">Lead Source</label><select class="sel" id="mL" onchange="upP()">'+
    ['Company Lead','Self-Gen'].map(l=>'<option'+( lead===l?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
    '<div class="fg"><label class="lbl">Actual Total ($)</label><div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)">$</span>'+
    '<input class="inp" id="mTot" type="number" value="'+( c['Actual Total']||'')+'" placeholder="0.00" style="padding-left:22px" oninput="upP()"></div></div></div>'+
    '<div id="pbox"></div>'+
    '<div class="lbl" style="margin-bottom:8px">Phase</div>'+
    '<div class="prow">'+PHASES.map(p=>'<button class="pbtn'+( sP===p?' on':'')+'" onclick="pickP(\''+p+'\',this)">'+p+'</button>').join('')+'</div>'+
    '<div class="fg" style="margin-bottom:14px"><label class="lbl">Notes</label>'+
    '<textarea class="inp" id="mNo" rows="3" style="resize:vertical">'+hs(c['Notes']||'')+'</textarea></div>'+
    '<div class="arow">'+
    '<button class="svbtn" id="mSv" onclick="saveC()">Save</button>'+
    (isE?'<button class="delbtn" onclick="delC(\''+eid+'\')">Delete</button>':'')+
    '<button class="canbtn" onclick="closeModal()">Cancel</button>'+
    '</div>';
  upP();
}

function roofHTML(sh,sq){
  return '<div class="rdet"><div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px">🏠 Roof Details</div>'+
    '<div class="fg2"><div class="fg"><label class="lbl">Shingle Type</label><select class="sel" id="mSh" onchange="upP()">'+
    ['Architectural','Metal'].map(s=>'<option'+( sh===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>'+
    '<div class="fg"><label class="lbl">Square Count</label><input class="inp" id="mSq" type="number" value="'+( sq||'')+'" placeholder="28" oninput="upP()"></div></div>'+
    '<div id="phint" style="font-size:11px;color:var(--gold);margin-top:6px"></div></div>';
}

function togT(t,el){
  el.classList.toggle('on');
  if(el.classList.contains('on')){if(!sT.includes(t))sT.push(t);}else{sT=sT.filter(x=>x!==t);}
  const rd=document.getElementById('rdet');
  if(sT.includes('Roof')){if(!rd.innerHTML){rd.innerHTML=roofHTML('Architectural','');}}
  else{rd.innerHTML='';}
  upP();
}

function pickP(p,btn){sP=p;document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

function upP(){
  const sq=parseFloat((document.getElementById('mSq')||{}).value)||0;
  const sh=((document.getElementById('mSh')||{}).value)||'Architectural';
  const lead=((document.getElementById('mL')||{}).value)||'Company Lead';
  const tot=parseFloat((document.getElementById('mTot')||{}).value)||0;
  const hint=document.getElementById('phint');
  if(hint&&sq>0){hint.textContent=sq+' sq × $'+(sh==='Metal'?METAL:ARCH)+'/sq = '+fmt(sq*(sh==='Metal'?METAL:ARCH))+' suggested';}
  const pb=document.getElementById('pbox');if(!pb)return;
  if(sq>0&&sT.includes('Roof')){
    const p=calcP(sq,sh,lead,tot);
    const contract=tot>0?tot:sq*(sh==='Metal'?METAL:ARCH);
    const build=sq*(sh==='Metal'?MBUILD:ABUILD);
    const pct=contract>0?(p/contract*100):0;
    pb.innerHTML='<div class="pbox"><div><div class="lbl">Suggested/Contract</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--gold)">'+fmt(contract)+'</div></div>'+
      '<div><div class="lbl">Est. Payout</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--green)">'+fmt(p)+'</div></div>'+
      '<div><div class="lbl">Payout %</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:'+( pct>=20?'var(--green)':pct>=12?'var(--gold)':'var(--red)')+'">'+pct.toFixed(1)+'%</div></div>'+
      '<div><div class="lbl">Build Cost</div><div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--red)">'+fmt(build)+'</div></div></div>';
  }else{pb.innerHTML='';}
}

function gF(){
  return{
    name:(document.getElementById('mN')||{}).value||'',
    phone:(document.getElementById('mPh')||{}).value||'',
    address:(document.getElementById('mA')||{}).value||'',
    carrier:(document.getElementById('mCar')||{}).value||'',
    insuranceStatus:(document.getElementById('mIS')||{}).value||'',
    trades:sT.join(', '),
    shingleType:(document.getElementById('mSh')||{}).value||'',
    squares:(document.getElementById('mSq')||{}).value||'',
    actualTotal:(document.getElementById('mTot')||{}).value||'',
    leadSource:(document.getElementById('mL')||{}).value||'Company Lead',
    phase:sP,
    notes:(document.getElementById('mNo')||{}).value||''
  };
}

async function saveC(){
  const btn=document.getElementById('mSv'),f=gF();
  if(!f.name){alert('Name required');return;}
  btn.disabled=true;btn.textContent='Saving...';
  const sq=parseFloat(f.squares)||0;
  const ep=calcP(sq,f.shingleType,f.leadSource,f.actualTotal);
  const data={...f,estimatedPayout:ep>0?ep.toFixed(2):''};
  try{
    if(eid){
      data.id=eid;
      const r=await apiCall('update',data);if(r.error)throw new Error(r.error);
      const idx=clients.findIndex(c=>c['ID']===eid);
      if(idx>=0)clients[idx]={'ID':eid,'Name':f.name,'Phone':f.phone,'Address':f.address,'Carrier':f.carrier,'Insurance Status':f.insuranceStatus,'Trades':f.trades,'Shingle Type':f.shingleType,'Squares':f.squares,'Actual Total':f.actualTotal,'Lead Source':f.leadSource,'Est Payout':data.estimatedPayout,'Phase':f.phase,'Notes':f.notes};
    }else{
      const r=await apiCall('add',data);if(r.error)throw new Error(r.error);
      clients.unshift({'ID':r.id,'Name':f.name,'Phone':f.phone,'Address':f.address,'Carrier':f.carrier,'Insurance Status':f.insuranceStatus,'Trades':f.trades,'Shingle Type':f.shingleType,'Squares':f.squares,'Actual Total':f.actualTotal,'Lead Source':f.leadSource,'Est Payout':data.estimatedPayout,'Phase':f.phase,'Notes':f.notes});
    }
    closeModal();renderAll();hStat('Saved ✓','var(--green)');
  }catch(e){alert('Save failed: '+e.message);btn.disabled=false;btn.textContent='Save';}
}

async function delC(id){
  if(!confirm('Delete this client?'))return;
  try{await apiCall('delete',{id});clients=clients.filter(c=>c['ID']!==id);closeModal();renderAll();hStat('Deleted','var(--red)');}
  catch(e){alert('Delete failed: '+e.message);}
}

load();
</script>
